[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  included_files = ["netlify/functions/assets/buske-logistics-logo.jpg"]

[functions."notification-sweeper"]
  schedule = "*/5 * * * *"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
